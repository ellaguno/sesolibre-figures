name: Release

# Publishes installable binaries as a permanent GitHub Release whenever you push
# a version tag, e.g.:
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags   # pushes commit + tag -> triggers this workflow
# or simply:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - name: Add & sync Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/figures-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Add & sync iOS platform
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Build unsigned (no code signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned .app into .ipa
        run: |
          cd ios/build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -R App.app Payload/
          zip -qr "figures-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload
      - name: Collect artifact
        run: |
          mkdir -p dist
          cp "ios/build/Build/Products/Debug-iphoneos/figures-${GITHUB_REF_NAME}-ios-unsigned.ipa" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated build for `${{ github.ref_name }}`.

            - **Android** (`*.apk`): debug-signed, installable via side-load.
            - **iOS** (`*.ipa`): **unsigned** — compile-checked only, not
              installable until signed with an Apple Developer certificate
              (see README → "Signing iOS").
          files: dist/*
